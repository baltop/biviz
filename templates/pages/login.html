{{define "title"}}BiViz — 로그인{{end}}

{{define "content"}}
<div class="min-h-screen flex items-center justify-center px-4 page-bg">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 mb-6 shadow-indigo-500/25 shadow-lg">
                <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">BiViz</h1>
            <p class="auth-sub mt-2">데이터 인사이트를 시각화하세요</p>
        </div>

        <div class="auth-card rounded-2xl p-8 shadow-2xl"
             x-data="{ loading: false, show: false }">
            <h2 class="text-xl font-semibold mb-6">로그인</h2>

            <div id="auth-error">
                {{if .Error}}
                <div class="flex items-center gap-3 p-4 mb-4 bg-red-500/10 border-red-500/20 rounded-xl text-red-400 text-sm" style="border:1px solid rgba(239,68,68,0.2)">
                    <span>{{.Error}}</span>
                </div>
                {{end}}
            </div>

            <form hx-post="/api/login" hx-target="#auth-error" hx-swap="innerHTML"
                  @htmx:before-request="loading = true" @htmx:after-request="loading = false"
                  class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium auth-label mb-2">이메일</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                           class="auth-input w-full px-4 py-3 rounded-xl transition-all duration-200" style="outline:none">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium auth-label mb-2">비밀번호</label>
                    <div class="relative">
                        <input :type="show ? 'text' : 'password'" id="password" name="password" required placeholder="••••••••"
                               class="auth-input w-full px-4 py-3 rounded-xl pr-12 transition-all duration-200" style="outline:none">
                        <button type="button" @click="show = !show"
                                class="absolute right-3 top-1/2 -translate-y-1/2 auth-sub" style="background:none;border:none;cursor:pointer">
                            <svg x-show="!show" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <svg x-show="show" x-cloak class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" :disabled="loading"
                        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium rounded-xl
                               hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 disabled:cursor-not-allowed
                               transition-all duration-200 shadow-lg shadow-indigo-500/25"
                        style="border:none;cursor:pointer">
                    <span x-show="!loading">로그인</span>
                    <span x-show="loading" x-cloak class="flex items-center justify-center gap-2">
                        <svg class="animate-spin w-5 h-5" viewBox="0 0 24 24" fill="none">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        로그인 중...
                    </span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <span class="auth-sub text-sm">계정이 없으신가요?</span>
                <a href="/signup" class="auth-link text-sm font-medium ml-1">회원가입</a>
            </div>
        </div>
        <p class="text-center auth-footer text-xs mt-8">© 2026 BiViz. 데이터 시각화 솔루션</p>
    </div>
</div>
{{end}}
